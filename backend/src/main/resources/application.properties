spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.data.redis.repositories.enabled=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# Google Sign-In OAuth client ID (Web application type, from Google Cloud
# Console > Credentials). Must match NEXT_PUBLIC_GOOGLE_CLIENT_ID on the
# frontend. Blank = "Login with Google" is not configured and will be rejected.
google.client-id=${GOOGLE_CLIENT_ID:}


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Schema is owned by Flyway (db/migration/V*.sql). Replaces the previous
# spring.sql.init script list, which re-ran the same DDL on every boot with
# continue-on-error=true — a failed statement was swallowed, so the schema
# could end up half-migrated with nothing recording what had been applied.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The live database predates Flyway and already has the V1 baseline applied,
# so baseline it at 1 instead of replaying the 990-line base script. V2+ are
# all idempotent (IF NOT EXISTS), so they converge an existing database
# safely and still build a brand-new one from scratch.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

mailtrap.api-token=${MAILTRAP_API_TOKEN}
mailtrap.api-url=${MAILTRAP_API_URL}
mailtrap.from-email=${MAILTRAP_FROM_EMAIL}
mailtrap.from-name=${MAILTRAP_FROM_NAME}

app.base-url=${APP_BASE_URL}
app.frontend-url=${APP_FRONTEND_URL}

# Comma-separated list of origins allowed to call /api/** (CORS).
# Local Next.js dev server defaults to http://localhost:3000.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

gemini.api.key=${GEMINI_API_KEY}
# Gemini model id (see https://ai.google.dev/gemini-api/docs/models for current names).
# Override via GEMINI_MODEL if Google retires the default model below.
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# MarketScout Crawler & Scoring Config
app.tavily.api-key=${TAVILY_API_KEY:}
app.vietqr.base-url=https://api.vietqr.io/v2
app.gleif.base-url=https://api.gleif.org/api/v1
app.rdap.base-url=https://rdap.org/domain
app.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.nominatim.contact-email=${NOMINATIM_CONTACT_EMAIL:hello@marketscout.io.vn}
app.tineye.api-key=${TINEYE_API_KEY:}
app.tineye.base-url=https://api.tineye.com/rest
app.opensanctions.base-url=${OPENSANCTIONS_URL:http://localhost:8080}
app.opensanctions.api-key=${OPENSANCTIONS_API_KEY:}
app.scoring.rubric-config=${SCORING_RUBRIC_CONFIG:}

# P5 (Financial & Tax) official-registry sources — real filed data for GB/US,
# free to register. Blank = that country silently falls back to Tavily search
# (CrawlerP5Router). Get a free key: https://developer.company-information.service.gov.uk/
app.p5-registry.uk-api-key=${COMPANIES_HOUSE_API_KEY:}

# OpenSanctions daily budget + partner sanction-check caps (API/token optimization)
app.opensanctions.daily-budget=45
app.partners.max-sanction-check=8
app.partners.display-count=5

# Cache TTL (days)
app.cache.p1-ttl-days=7
app.cache.p2-ttl-days=7
app.cache.p3-ttl-days=3
app.cache.p4-ttl-days=7
app.cache.p5-ttl-days=3
app.cache.p6-ttl-days=1
app.cache.p8-ttl-days=7

# ── Payment / SePay VietQR top-up ─────────────────────────────────────
# Price of one verification credit is admin-editable at runtime — see
# payment_settings table (db/payment_settings.sql), not a static property.
# Minutes a VietQR is valid before it expires and the order is voided.
app.payment.qr-expiry-minutes=15
# Receiving bank account that buyers transfer to. bank-code is the SePay/
# Napas short code (e.g. "MB", "VCB", "ACB"); account-name is the display name.
app.payment.bank-code=${SEPAY_BANK_CODE:MB}
app.payment.account-no=${SEPAY_ACCOUNT_NO:}
app.payment.account-name=${SEPAY_ACCOUNT_NAME:MARKETSCOUT}
# SePay webhook shared secret — sent as "Authorization: Apikey <key>".
app.payment.sepay-api-key=${SEPAY_API_KEY:}
# SePay dynamic-QR image endpoint.
app.payment.sepay-qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
# SePay userapi Bearer token (my.sepay.vn > API Access). Optional — when set,
# a reconciliation poller confirms paid orders even if the webhook was missed.
app.payment.sepay-api-token=${SEPAY_API_TOKEN:}
app.payment.sepay-tx-list-url=${SEPAY_TX_LIST_URL:https://my.sepay.vn/userapi/transactions/list}
# How often the reconciler polls SePay, and how far back it looks.
app.payment.reconcile-sweep-ms=${SEPAY_RECONCILE_SWEEP_MS:90000}
app.payment.reconcile-lookback-hours=24

# Contract uploads are capped at 10MB (README_contract_verification_feature.md §5.6)
# and stored directly in Postgres (contracts.file_data bytea) — no external storage service.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Railway: read dynamic port and expose health check
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Expose Kubernetes-style probes so Railway can health-check liveness only.
# Liveness = "the app process is up" and does NOT depend on DB/Redis, so a
# transient Redis/DB hiccup can never fail the deploy health check.
management.endpoint.health.probes.enabled=true
# Redis is a best-effort cache, not a hard dependency: don't let a Redis outage
# mark the whole instance DOWN.
management.health.redis.enabled=false

# SpringDoc off by default. SecurityConfig permits /v3/api-docs/** and
# /swagger-ui/** without authentication, and SpringDoc enables both unless told
# otherwise — so production was publishing a complete, unauthenticated map of
# every endpoint and DTO, including /api/v1/admin/**. Set SPRINGDOC_ENABLED=true
# locally when you need the UI; leave it unset everywhere else.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

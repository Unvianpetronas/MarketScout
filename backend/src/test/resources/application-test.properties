# ── Test overrides — no real connections needed ───────────────────────────────

# JWT — fixed test secret (>= 256 bits for HS256)
jwt.secret=TestSecretKeyForJWTMustBeAtLeast256BitsLongEnoughForHS256Algorithm!!
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Database — H2 in-memory (replaces SQL Server for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis — Lettuce connects lazily, so a dummy host is safe for unit tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Mailtrap — stub values (email is never actually sent in tests)
mailtrap.api-token=test-token
mailtrap.api-url=http://localhost:9999
mailtrap.from-email=no-reply@test.com
mailtrap.from-name=TestApp

# App
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173

# Suppress noisy security trace logs in test output
logging.level.org.springframework.security=WARN

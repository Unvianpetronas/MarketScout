name: CI

# Minimal safety net: run tests + build on every push/PR touching backend or
# frontend, so a broken commit is caught before Railway auto-deploys it. This
# repo previously had no CI at all — every push went straight to production.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # `npm run lint` is intentionally NOT a blocking step here: as of
      # 2026-07-19 it already fails on ~13 pre-existing errors (mostly
      # react-hooks/set-state-in-effect on fetch-on-mount pages) across
      # files unrelated to any single change, predating this CI pipeline.
      # Surfaced non-blocking so it's visible without turning CI permanently
      # red on unrelated debt. Fix the underlying issues, then flip this back
      # into a real "Lint" step above.
      - name: Lint (non-blocking — see comment above)
        run: npm run lint
        continue-on-error: true

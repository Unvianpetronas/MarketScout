name: CI

# Minimal safety net: run tests + build on every push/PR touching backend or
# frontend, so a broken commit is caught before Railway auto-deploys it. This
# repo previously had no CI at all — every push went straight to production.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real PostgreSQL for SchemaMigrationPostgresTest, which applies the Flyway
    # migrations to an empty database and checks the result against the JPA
    # entities. Everything else here is a Mockito unit test, so without this
    # nothing would ever execute a migration or catch schema drift. Supplied as
    # a service rather than via Testcontainers, whose bundled docker-java
    # cannot negotiate an API version Docker Engine 29 accepts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketscout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        # The schema test skips itself when this is unset, so it must stay set
        # here — otherwise the migration check silently stops running.
        env:
          MARKETSCOUT_TEST_DB_URL: jdbc:postgresql://localhost:5432/marketscout_test
          MARKETSCOUT_TEST_DB_USER: postgres
          MARKETSCOUT_TEST_DB_PASSWORD: postgres
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

